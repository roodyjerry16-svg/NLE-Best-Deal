name: Install NLE Rewards
on:
  push:
    branches: [main]
    paths:
      - 'nle-rewards-snippet.html'
      - '.github/workflows/install-rewards.yml'
      - 'scripts/install_rewards.py'
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Install rewards section into index
        run: python3 scripts/install_rewards.py
      - name: Commit installed section
        run: |
          if git diff --quiet -- index.html; then
            echo "No index changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Install NLE Rewards into storefront"
          git push
